name: Actualiser L’éco de la semaine

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "17 9 * * 1"
      timezone: "Europe/Paris"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  actualiser-et-publier:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le bulletin
        run: python update_actualites.py

      - name: Archiver le bulletin dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualites.json archives/
          if git diff --cached --quiet; then
            echo "Aucune modification à archiver."
          else
            git commit -m "Archive bulletin $(date -u +'%Y-%m-%d') [skip ci]"
            git push
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
