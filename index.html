<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’éco de la semaine</title>
<style>
:root{--papier:#F1F4F0;--encre:#1C2621;--encre-clair:#55635B;--sauge:#6F8B73;--sauge-pale:#D6E0D5;--trait:#C3CFC2;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--papier);color:var(--encre);font-family:var(--serif);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}.page{max-width:900px;margin:0 auto;padding:48px 28px 72px}header.tete{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid var(--encre)}.titre{font-size:42px;line-height:1.05;font-weight:400;margin:0;letter-spacing:-.015em}.titre em{font-style:italic;color:var(--sauge)}.periode{font-family:var(--sans);font-size:13.5px;color:var(--encre-clair);text-align:right;line-height:1.4}.chapeau{font-family:var(--sans);font-size:14.5px;color:var(--encre-clair);max-width:67ch;margin:16px 0 0}.section-titre{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:34px 0 2px;color:var(--sauge)}.section-intro{font-family:var(--sans);font-size:13.5px;color:var(--encre-clair);margin:0 0 4px}.reperes{margin-top:6px}article.repere{display:grid;grid-template-columns:200px 1fr;gap:0 36px;padding:30px 0;border-bottom:1px solid var(--trait)}.marge{padding-top:4px}.chiffre{font-size:40px;line-height:1;letter-spacing:-.02em;color:var(--encre);word-break:break-word}.unite{font-family:var(--sans);font-size:12.5px;line-height:1.35;color:var(--encre-clair);margin-top:8px;max-width:23ch}.provenance,.breve-meta{font-family:var(--sans);font-size:12px;color:var(--encre-clair);margin-top:14px}.provenance a,.breve-meta a{color:var(--sauge);text-decoration:none;border-bottom:1px solid var(--sauge-pale)}.corps{border-left:2px solid var(--sauge-pale);padding-left:24px}.repere h2{font-size:21px;font-weight:600;line-height:1.3;margin:0 0 10px;letter-spacing:-.01em}.explication{margin:0;max-width:62ch}.notion{font-family:var(--sans);font-size:13px;color:var(--sauge);margin-top:14px;font-weight:600}.question{margin:18px 0 0;padding:12px 16px;background:rgba(111,139,115,.10);font-style:italic;max-width:60ch}.breves{margin-top:14px;border-top:2px solid var(--encre)}article.breve{display:grid;grid-template-columns:135px 1fr;gap:0 28px;padding:24px 0;border-bottom:1px solid var(--trait)}.breve-notion{font-family:var(--sans);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.045em;color:var(--sauge);padding-top:3px}.breve h3{margin:0 0 7px;font-size:19px;line-height:1.32;font-weight:600}.breve-resume{margin:0;max-width:65ch}.breve-meta{margin-top:10px}.etat{padding:52px 0;max-width:56ch}.etat p{margin:0 0 8px}.etat .sous{font-family:var(--sans);font-size:14.5px;color:var(--encre-clair)}.pulse{color:var(--sauge)}footer.pied{margin-top:34px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-family:var(--sans);font-size:12.5px;color:var(--encre-clair)}
@media(max-width:680px){.page{padding:32px 20px 56px}.titre{font-size:32px}article.repere{grid-template-columns:1fr;gap:16px}.corps{border-left:none;padding-left:0}.chiffre{font-size:34px}.marge{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.unite{margin-top:0}.provenance{margin-top:0;width:100%}article.breve{grid-template-columns:1fr;gap:6px}}
</style>
</head><body><div class="page"><header class="tete"><h1 class="titre">L’éco de <em>la semaine</em></h1><div class="periode" id="periode"></div></header><p class="chapeau">Quelques repères pour mesurer l’économie, puis trois brèves pour suivre les faits économiques à retenir. Le bulletin est renouvelé chaque lundi.</p><main id="contenu"><div class="etat"><p class="pulse">Lecture du bulletin…</p></div></main><footer class="pied"><span id="signature"></span><span id="sourceInfo"></span></footer></div>
<script>
function e(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function lien(source,url){const s=e(source||"");return url?'<a href="'+e(url)+'" target="_blank" rel="noopener noreferrer">'+s+'</a>':s}function etat(t,s){document.getElementById("contenu").innerHTML='<div class="etat"><p class="pulse">'+e(t)+'</p>'+(s?'<p class="sous">'+e(s)+'</p>':'')+'</div>'}
function afficher(b){const r=b.reperes||[],br=b.breves||[];document.getElementById("periode").textContent=b.periode||"";let h='';if(r.length){h+='<section><h2 class="section-titre">Les repères de la semaine</h2><p class="section-intro">Quelques indicateurs pour situer la conjoncture.</p><div class="reperes">'+r.map(f=>'<article class="repere"><div class="marge"><div class="chiffre">'+e(f.chiffre)+'</div><div class="unite">'+e(f.unite)+'</div><div class="provenance">'+lien(f.source,f.url)+(f.date?' · '+e(f.date):'')+'</div></div><div class="corps"><h2>'+e(f.titre)+'</h2><p class="explication">'+e(f.explication)+'</p><p class="notion">Notion : '+e(f.notion)+'</p>'+(f.question?'<p class="question">'+e(f.question)+'</p>':'')+'</div></article>').join('')+'</div></section>'}if(br.length){h+='<section><h2 class="section-titre">En bref</h2><p class="section-intro">Trois informations économiques à connaître cette semaine.</p><div class="breves">'+br.map(f=>'<article class="breve"><div class="breve-notion">'+e(f.notion)+'</div><div><h3>'+e(f.titre)+'</h3>'+(f.resume?'<p class="breve-resume">'+e(f.resume)+'</p>':'')+'<div class="breve-meta">'+lien(f.source,f.url)+(f.date?' · '+e(f.date):'')+'</div></div></article>').join('')+'</div></section>'}if(!h){etat("Aucune information n’a pu être retenue cette semaine.","Le précédent bulletin reste disponible jusqu’à la prochaine actualisation.");return}document.getElementById("contenu").innerHTML=h;document.getElementById("signature").textContent=b.publie?"Bulletin établi le "+b.publie:"";document.getElementById("sourceInfo").textContent=b.sources?"Sources : "+b.sources.join(" · "):""}
fetch("actualites.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(afficher).catch(()=>etat("Le bulletin ne peut pas être chargé.","Vérifiez la publication GitHub Pages."));
</script></body></html>
