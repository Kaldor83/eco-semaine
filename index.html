<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’éco de la semaine</title>
<style>
  :root{
    --papier:#F1F4F0;
    --encre:#1C2621;
    --encre-clair:#55635B;
    --sauge:#6F8B73;
    --sauge-pale:#D6E0D5;
    --trait:#C3CFC2;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}

  body{
    background:var(--papier);
    color:var(--encre);
    font-family:var(--serif);
    font-size:17px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .page{max-width:900px;margin:0 auto;padding:48px 28px 72px}

  header.tete{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    padding-bottom:18px;
    border-bottom:2px solid var(--encre);
  }

  .titre{
    font-size:42px;
    line-height:1.05;
    font-weight:400;
    margin:0;
    letter-spacing:-0.015em;
  }

  .titre em{font-style:italic;color:var(--sauge)}

  .periode{
    font-family:var(--sans);
    font-size:13.5px;
    color:var(--encre-clair);
    text-align:right;
    line-height:1.4;
  }

  .chapeau{
    font-family:var(--sans);
    font-size:14.5px;
    color:var(--encre-clair);
    max-width:62ch;
    margin:16px 0 0;
  }

  .faits{margin-top:8px}

  article.fait{
    display:grid;
    grid-template-columns:200px 1fr;
    gap:0 36px;
    padding:34px 0;
    border-bottom:1px solid var(--trait);
  }

  .marge{padding-top:4px}

  .chiffre{
    font-size:40px;
    line-height:1;
    letter-spacing:-0.02em;
    color:var(--encre);
    word-break:break-word;
  }

  .unite{
    font-family:var(--sans);
    font-size:12.5px;
    line-height:1.35;
    color:var(--encre-clair);
    margin-top:8px;
    max-width:22ch;
  }

  .provenance{
    font-family:var(--sans);
    font-size:12px;
    color:var(--encre-clair);
    margin-top:14px;
  }

  .provenance a{
    color:var(--sauge);
    text-decoration:none;
    border-bottom:1px solid var(--sauge-pale);
  }

  .provenance a:hover{border-bottom-color:var(--sauge)}

  .corps{
    border-left:2px solid var(--sauge-pale);
    padding-left:24px;
  }

  .fait h2{
    font-size:21px;
    font-weight:600;
    line-height:1.3;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }

  .explication{margin:0;max-width:62ch}

  .notion{
    font-family:var(--sans);
    font-size:13px;
    color:var(--sauge);
    margin-top:14px;
    font-weight:600;
  }

  .question{
    margin:18px 0 0;
    padding:12px 16px;
    background:rgba(111,139,115,.10);
    font-style:italic;
    max-width:60ch;
  }

  .etat{
    padding:64px 0;
    max-width:56ch;
  }

  .etat p{margin:0 0 8px}

  .etat .sous{
    font-family:var(--sans);
    font-size:14.5px;
    color:var(--encre-clair);
  }

  .pulse{color:var(--sauge)}

  footer.pied{
    margin-top:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    font-family:var(--sans);
    font-size:12.5px;
    color:var(--encre-clair);
  }

  .archives{
    color:var(--sauge);
    text-decoration:none;
    border-bottom:1px solid var(--sauge-pale);
  }

  @media (max-width:680px){
    .page{padding:32px 20px 56px}
    .titre{font-size:32px}
    article.fait{grid-template-columns:1fr;gap:16px}
    .corps{border-left:none;padding-left:0}
    .chiffre{font-size:34px}
    .marge{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
    .unite{margin-top:0}
    .provenance{margin-top:0;width:100%}
  }
</style>
</head>

<body>
<div class="page">

  <header class="tete">
    <h1 class="titre">L’éco de <em>la semaine</em></h1>
    <div class="periode" id="periode"></div>
  </header>

  <p class="chapeau">
    Quatre faits d’actualité économique, chacun rattaché à une grande notion du cours.
    Le bulletin est renouvelé chaque lundi.
  </p>

  <main id="contenu">
    <div class="etat">
      <p class="pulse">Lecture du bulletin…</p>
    </div>
  </main>

  <footer class="pied">
    <span id="signature"></span>
    <span id="sourceInfo"></span>
  </footer>

</div>

<script>
function echapper(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function afficherEtat(titre, sous){
  document.getElementById("contenu").innerHTML =
    '<div class="etat"><p class="pulse">' + echapper(titre) + '</p>' +
    (sous ? '<p class="sous">' + echapper(sous) + '</p>' : '') +
    '</div>';
}

function afficherFaits(bulletin){
  const faits = bulletin.faits || [];
  const contenu = document.getElementById("contenu");

  document.getElementById("periode").textContent = bulletin.periode || "";

  if (!faits.length){
    afficherEtat("Aucun fait n’est disponible cette semaine.",
                 "Le bulletin sera actualisé lors de la prochaine publication.");
    return;
  }

  contenu.innerHTML = '<div class="faits">' + faits.map(function(f){
    const source = echapper(f.source || "");
    const url = f.url ? echapper(f.url) : "";
    const sourceHtml = url
      ? '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + source + '</a>'
      : source;

    return '<article class="fait">' +
      '<div class="marge">' +
        '<div class="chiffre">' + echapper(f.chiffre) + '</div>' +
        '<div class="unite">' + echapper(f.unite) + '</div>' +
        '<div class="provenance">' + sourceHtml +
          (f.date ? ' · ' + echapper(f.date) : '') +
        '</div>' +
      '</div>' +
      '<div class="corps">' +
        '<h2>' + echapper(f.titre) + '</h2>' +
        '<p class="explication">' + echapper(f.explication) + '</p>' +
        '<p class="notion">Notion : ' + echapper(f.notion) + '</p>' +
        (f.question ? '<p class="question">' + echapper(f.question) + '</p>' : '') +
      '</div>' +
    '</article>';
  }).join("") + '</div>';

  document.getElementById("signature").textContent =
    bulletin.publie ? "Bulletin établi le " + bulletin.publie : "";

  document.getElementById("sourceInfo").textContent =
    bulletin.sources ? "Sources : " + bulletin.sources.join(" · ") : "";
}

async function demarrer(){
  try{
    const reponse = await fetch("actualites.json", {cache:"no-store"});
    if(!reponse.ok) throw new Error("Impossible de lire actualites.json");
    const bulletin = await reponse.json();
    afficherFaits(bulletin);
  }catch(e){
    console.error(e);
    afficherEtat(
      "Le bulletin ne peut pas être chargé directement depuis ce fichier.",
      "Il fonctionnera normalement une fois hébergé sur GitHub Pages. Pour un test local, ouvrez-le via un petit serveur web."
    );
  }
}

demarrer();
</script>
</body>
</html>
